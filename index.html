<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>خريطة أحياء حائل</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#e7eef2;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#17202a}
  #map{position:fixed;inset:0;z-index:1}
  .leaflet-container{font-family:inherit;background:#f4f5f7}
  .filter{
    position:fixed;top:14px;right:14px;z-index:500;
    width:min(280px, calc(100vw - 28px));
    background:rgba(255,255,255,.96);
    border:1px solid rgba(20,30,40,.08);
    border-radius:12px;
    box-shadow:0 10px 28px rgba(20,30,40,.16);
    padding:10px;
    backdrop-filter:blur(8px);
  }
  .frow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .alink{font-size:12px;font-weight:600;color:#0f6e56;text-decoration:none;margin:0 6px 6px}
  .alink:hover{text-decoration:underline}
  .isel{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .isel .ib{border:1px solid #d5dbe3;background:#fff;color:#334155;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .isel .ib.on{background:#17202a;color:#fff;border-color:#17202a}
  .isel .it{width:100%;font-size:12px;font-weight:800;color:#5d6b78;margin:0 6px}
  .raw{margin-top:10px}
  .rw{display:grid;grid-template-columns:1fr auto 44px;gap:8px;align-items:baseline;padding:6px 2px;border-bottom:1px solid #eef1f5;font-size:13px}
  .rw b{font-weight:600}
  .rt{margin:12px 2px 2px;font-size:12px;font-weight:700;color:#6b7785}
  .rw em{font-style:normal;font-size:12px;color:#6b7785;text-align:left}
  .filter label{display:block;font-size:12px;font-weight:800;color:#5d6b78;margin:0 6px 6px}
  .filter input,.filter select{
    width:100%;border:1px solid #e3e8ee;background:#f7f9fb;border-radius:12px;
    padding:11px 12px;font-size:15px;font-family:inherit;color:#17202a;outline:none
  }
  .filter select{margin-top:8px;background:#fff}
  .filter input:focus,.filter select:focus{border-color:#0f6e56;box-shadow:0 0 0 3px rgba(15,110,86,.12)}
  .sheet{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:500;
    background:#fff;border-radius:22px;
    box-shadow:0 16px 40px rgba(20,30,40,.22);
    padding:14px 14px 16px;
    transform:translateY(120%);
    transition:transform .28s ease, top .28s ease, max-height .28s ease;
    max-height:42vh;overflow:auto;
  }
  .sheet.open{transform:translateY(0)}
  .sheet.expanded{
    top:14px;bottom:12px;max-height:none;
  }
  .chart-btn{
    width:100%;margin-top:12px;border:1px solid #d5dbe3;background:#f7f8fa;color:#1c2430;
    border-radius:14px;padding:13px 12px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer
  }
  .chart-panel{display:none;margin-top:12px}
  .sheet.expanded .chart-panel{display:block}
  .chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .chart-head b{font-size:15px}
  .back{
    border:1px solid #d5dbe3;background:#fff;border-radius:10px;padding:8px 10px;
    font-family:inherit;font-weight:700;cursor:pointer
  }
  .chart-wrap{position:relative;height:min(62vh, 520px)}
  .chart-note{font-size:12px;color:#6b7785;margin:0 0 8px}
  .sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .sheet h2{margin:0;font-size:22px;line-height:1.3}
  .en{color:#6b7785;font-size:12px;margin-top:2px}
  .x{
    border:0;background:#f2f4f7;width:34px;height:34px;border-radius:50%;
    font-size:18px;cursor:pointer;color:#334;flex:0 0 auto
  }
  .qol{
    margin-top:12px;background:#f7f8fa;border:1px solid #e3e7ee;border-radius:14px;
    padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px
  }
  .qol .t{font-size:14px;font-weight:800;color:#243040}
  .qol .sub{font-size:11px;color:#6b7785;margin-top:2px}
  .score{
    min-width:64px;height:48px;border-radius:14px;background:#fff;color:#243040;
    border:1px solid #cfd6df;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800
  }
  .score small{font-size:11px;font-weight:700;margin-right:2px;opacity:.85}
  .hint{
    position:fixed;top:14px;left:14px;z-index:500;
    background:rgba(255,255,255,.92);border-radius:999px;padding:8px 12px;
    font-size:12px;color:#41505e;box-shadow:0 6px 16px rgba(20,30,40,.12)
  }
  @media (min-width:900px){
    .sheet{left:auto;right:14px;top:92px;bottom:14px;width:360px;max-height:none}
  }

  .chips{position:fixed;z-index:550;top:164px;right:14px;left:14px;display:flex;justify-content:safe center;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid #dde3ea;
    background:#fff;border-radius:8px;padding:8px 14px;
    font-family:inherit;font-size:13px;font-weight:600;color:#3a4756;cursor:pointer;
    box-shadow:0 2px 8px rgba(20,30,40,.10);transition:border-color .15s,color .15s,background .15s
  }
  .chip:hover{border-color:#b9c3cf}
  .chip i{width:4px;height:18px;border-radius:2px;background:var(--c)}
  .chip span{font-size:12px;font-weight:500;color:#7a8794;font-variant-numeric:tabular-nums}
  .chip.on{background:#fff;border-color:#1b5e3f;color:#17202a;box-shadow:0 2px 10px rgba(20,30,40,.18)}
  .chip.on[style*="--c"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c),0 2px 10px rgba(20,30,40,.18)}
  .chip.on span{color:#17202a;font-weight:700}
  @media (min-width:900px){
    .chips{top:14px;right:308px;left:14px;padding-bottom:2px}
  }
  @media (min-width:1200px){
    .chips{left:308px}
  }
  .leaflet-top.leaflet-left{top:70px;left:8px;z-index:600}
  .leaflet-control-layers{border:0;border-radius:10px;box-shadow:0 8px 18px rgba(20,30,40,.18);background:#fff}
  .leaflet-control-layers-toggle{
    width:44px;height:44px;background-size:28px 28px;background-position:center;background-repeat:no-repeat;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2316323a' d='M12 3 3 8l9 5 9-5-9-5zm0 7.2L5.2 7 12 3.8 18.8 7 12 10.2zM3 12l9 5 9-5-1.6-.9L12 15.2 4.6 11.1 3 12zm0 4 9 5 9-5-1.6-.9L12 19.2 4.6 15.1 3 16z'/></svg>");
  }
  .leaflet-control-layers-expanded{padding:8px 10px}
  .leaflet-control-layers-base label{font-size:14px;display:flex;gap:6px;align-items:center;margin:6px 0}

  /* ===== تنسيق رسمي ===== */
  :root{--navy:#1b5e3f;--line:#cfd6df;--ink:#17202a;--mut:#5d6b78}
  .filter{padding:0;border-radius:4px;border:1px solid var(--line);background:#fff;box-shadow:0 2px 10px rgba(20,40,60,.14);backdrop-filter:none;overflow:hidden}
  .frow{background:var(--navy);padding:9px 14px;display:block}
  .filter label{color:#fff;margin:0;font-size:13px;font-weight:700;letter-spacing:.2px}
  .filter input,.filter select{width:calc(100% - 28px);margin:12px 14px 0;border-radius:3px;border:1px solid var(--line);background:#fff;padding:9px 10px;font-size:14px;box-sizing:border-box}
  .filter select{margin-top:8px}
  .filter input:focus,.filter select:focus{border-color:var(--navy);box-shadow:none}
  .isel{margin:12px 14px 14px;gap:6px;border-top:1px solid #e6eaef;padding-top:10px}
  .isel .it{margin:0 0 2px;color:var(--mut);font-size:12px;font-weight:700}
  .isel .ib{border-radius:3px;border:1px solid var(--line);padding:5px 10px;font-size:12px;font-weight:600;background:#fff;color:#2b3745}
  .isel .ib.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .sheet{padding:0;border-radius:4px;border:1px solid var(--line);box-shadow:0 2px 14px rgba(20,40,60,.20)}
  .sheet-top{background:var(--navy);color:#fff;padding:14px 16px;align-items:center}
  .sheet h2{font-size:19px;font-weight:700;color:#fff}
  .sheet .en{color:#c4e0d2;font-size:12px}
  .x{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:3px;width:30px;height:30px;font-size:16px}
  .x:hover{background:rgba(255,255,255,.14)}
  .qol{margin:14px 16px 0;border-radius:3px;background:#f5f7f9;border:1px solid var(--line);padding:10px 12px}
  .qol .t{font-size:13px;color:var(--ink)}
  .score{border-radius:3px;height:44px;min-width:70px;font-size:21px;background:#fff;border-width:2px}
  .raw{margin:8px 16px 0}
  .rw{padding:8px 2px;font-size:13px;border-bottom:1px solid #e6eaef}
  .rt{margin:14px 0 4px;padding:6px 8px;background:#e8f2ec;color:var(--navy);font-size:12px;border-radius:2px}
  .chart-btn{width:calc(100% - 32px);margin:14px 16px 16px;border-radius:3px;background:var(--navy);color:#fff;border:0;padding:11px;font-size:14px;font-weight:700}
  .chart-btn:hover{background:#247a52}
  .chart-panel{margin:0 16px 16px}
  .back{border-radius:3px}
  .chip{border-radius:3px;box-shadow:none;border:1px solid var(--line);padding:8px 16px}
  .chip.on{box-shadow:inset 0 -3px 0 var(--c,#1b5e3f)}
  .chip.on[style*="--c"]{box-shadow:inset 0 -3px 0 var(--c)}
  .leaflet-control-layers{border-radius:4px;box-shadow:0 2px 8px rgba(20,40,60,.2)}
  @media (min-width:900px){ .sheet{top:var(--st,92px)} .sheet.expanded{top:14px} }
</style>
</head>
<body>
<div id="map"></div>
<div class="filter">
  <div class="frow"><label for="q">تصفية الحي</label></div>
  <input id="q" type="search" placeholder="ابحث: العزيزية، صبابة…" autocomplete="off"/>
  <select id="pick" aria-label="الأحياء">
    <option value="">كل الأحياء</option>
  </select>
  <div class="isel" id="isel"></div>
</div>
</div>
<div class="chips" id="chips" role="group" aria-label="تصنيف الأحياء حسب المؤشر"></div>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheet-top">
    <div>
      <h2 id="dName">اسم الحي</h2>
      <div class="en" id="dEn"></div>
    </div>
    <button class="x" id="close" type="button" aria-label="إغلاق">×</button>
  </div>
  <div class="qol">
    <div>
      <div class="t">مؤشر جودة الحياة في الحي</div>
      <div class="sub" id="qolNote">من 100 — يُستبدل بالرقم الرسمي لاحقًا</div>
    </div>
    <div class="score" id="dScore">—</div>
  </div>
  <div class="raw" id="dRaw"></div>
  <button class="chart-btn" id="openChart" type="button">عرض مؤشرات الحي</button>
  <div class="chart-panel" id="chartPanel">
    <div class="chart-head">
      <b id="chartTitle">الرسم البياني</b>
      <button class="back" id="hideChart" type="button">تصغير</button>
    </div>
    <p class="chart-note" id="chartNote"></p>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>
</section>

// ===== بيانات المؤشرات (تأتي من صفحة الإدارة admin.html عبر localStorage أو ملف qol-data.json) =====
function normQD(d){
  d=d||{};
  const rt=(d.settings&&Array.isArray(d.settings.thresholds))?d.settings.thresholds.map(Number):[];
  const th=rt.length===2?rt:(rt.length===3?[rt[1],rt[2]]:[75,60]);
  return {
    indicators:Array.isArray(d.indicators)?d.indicators.map(i=>({key:String(i.key),name:String(i.name),weight:Number(i.weight)||0,unit:i.unit==null?'':String(i.unit)})):[],
    computed:(d.computed&&typeof d.computed==='object')?d.computed:{},
    values:(d.values&&typeof d.values==='object')?d.values:{},
    info:{fields:(d.info&&Array.isArray(d.info.fields))?d.info.fields.map(f=>({key:String(f.key),name:String(f.name),unit:f.unit==null?'':String(f.unit)})):[],values:(d.info&&d.info.values&&typeof d.info.values==='object')?d.info.values:{}},
    settings:{thresholds:th}
  };
}
function loadQD(){
  try{ const raw=localStorage.getItem('hailQol.v2'); if(raw) return Object.assign(normQD(JSON.parse(raw)),{src:'local'}); }catch(e){}
  return Object.assign(normQD({}),{src:'none'});
}
let QD=loadQD();
function computeQol(id){ const c=QD.computed&&QD.computed[id]; return c?c.overall:null; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parkWord(n){ n=Math.round(Number(n)); if(n===2) return 'حديقتان'; return (n>=3&&n<=10)?'حدائق':'حديقة'; }
function fmtN(x){ return (Math.round(x*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}); }
function renderRaw(id){
  const box=document.getElementById('dRaw'), c=QD.computed&&QD.computed[id], v=QD.values[id]||{};
  let html='';
  if(c) html+=QD.indicators.map(i=>{
    if(viewInds.length&&!viewInds.includes(i.key)) return '';
    const x=v[i.key]; if(x==null||x===''||c.scores[i.key]==null) return '';
    return '<div class="rw"><span>'+esc(i.name)+'</span><b>'+fmtN(x)+(i.unit?' '+esc(i.unit):'')+'</b><em>'+((c.pct&&c.pct[i.key]!=null)?fmtN(c.pct[i.key])+'%':c.scores[i.key])+'</em></div>';
  }).join('');
  const iv=(QD.info.values&&QD.info.values[id])||{};
  const rows=QD.info.fields.filter(f=>iv[f.key]!=null&&iv[f.key]!=='');
  if(rows.length) html+='<div class="rt">بيانات الحي</div>'+rows.map(f=>'<div class="rw"><span>'+esc(f.name)+'</span><b>'+fmtN(iv[f.key])+(f.key==='parks'?' '+parkWord(iv[f.key]):(f.unit?' '+esc(f.unit):''))+'</b><em></em></div>').join('');
  box.innerHTML=html;
}
function hasData(id){ return computeQol(id)!=null; }
function qolFor(id){
  const dq=computeQol(id); if(dq!=null) return dq;
  const ex=EXTRA[id];
  if (ex && ex.qol!=null) return ex.qol;
  let n=0; for (const ch of String(id)) n=(n*33+ch.charCodeAt(0))>>>0;
  return 62 + (n%29);
}
// فئات التصنيف حسب مؤشر جودة الحياة (من 100) — عدّل الحدود (min) والألوان من هنا
const TIERS=[
  {key:'good',  label:'مستوى جيد',     min:QD.settings.thresholds[0], color:'#2e7d4f'},
  {key:'mid',   label:'يحتاج تحسينًا', min:QD.settings.thresholds[1], color:'#e0a82e'},
  {key:'high',  label:'أولوية عالية',  min:0,  color:'#c0392b'}
];
let activeTier=null;
let viewInds=[];
function viewScore(id){
  if(!viewInds.length) return qolFor(id);
  const c=QD.computed&&QD.computed[id]; if(!c) return null;
  let sw=0,s=0;
  viewInds.forEach(k=>{ const v=c.scores[k]; if(v==null) return; const ind=QD.indicators.find(i=>i.key===k); const w=(ind&&ind.weight>0)?ind.weight:1; sw+=w; s+=v*w; });
  return sw? Math.round(s/sw*10)/10 : null;
}
const NOTIER={key:'none',label:'لا توجد بيانات',min:0,color:'#9aa5b1'};
function tierOf(id){ const s=viewScore(id); if(s==null) return NOTIER; return TIERS.find(t=>s>=t.min)||TIERS[TIERS.length-1]; }
function tierKey(id){ return tierOf(id).key; }
function styleFor(id, on){
  const c=tierOf(id).color;
  return {color:c, weight:on?2.5:1.2, opacity:on?1:0.55, fillColor:c, fillOpacity:on?0.55:0.4};
}
const layers={};

GEO.features.forEach(f=>{
  const id=f.properties.id;
  const layer=L.geoJSON(f,{
    style:styleFor(id,false),
    onEachFeature:(feat,lyr)=>{
      lyr.on('click', ()=>select(id,true));
      lyr.bindTooltip(feat.properties.label,{sticky:true,direction:'center'});
    }
  });
  layer.addTo(group);
  layers[id]={layer, props:f.properties};
});
map.fitBounds(group.getBounds(),{padding:[28,28]});

const pick=document.getElementById('pick');
const q=document.getElementById('q');
const names=Object.values(layers).map(x=>x.props).sort((a,b)=>a.label.localeCompare(b.label,'ar'));
function refill(filter){
  const cur=pick.value;
  pick.innerHTML='<option value="">كل الأحياء</option>';
  names.forEach(p=>{
    if(activeTier && tierKey(p.id)!==activeTier) return;
    if(filter && !p.label.includes(filter) && !p.name_en.toLowerCase().includes(filter.toLowerCase())) return;
    const o=document.createElement('option');
    o.value=p.id; o.textContent=p.label; pick.appendChild(o);
  });
  if([...pick.options].some(o=>o.value===cur)) pick.value=cur;
}
refill('');

function seriesFor(id){
  const ex=EXTRA[id];
  if (ex && Array.isArray(ex.series) && ex.series.length) return ex.series.slice();
  let n=0; for (const ch of String(id)) n=(n*33+ch.charCodeAt(0))>>>0;
  const out=[];
  for(let i=0;i<6;i++){ n=(n*1103515245+12345)>>>0; out.push(20+(n%80)); }
  return out;
}
let selected=null;
let chartObj=null;
function collapseChart(){
  document.getElementById('sheet').classList.remove('expanded');
  if(chartObj){ chartObj.destroy(); chartObj=null; }
}
function select(id, fromMap){
  selected=id;
  collapseChart();
  const p=layers[id].props;
  const score=viewScore(id);
  document.getElementById('dName').textContent=p.label;
  document.getElementById('dEn').textContent=p.name_en||'';
  document.getElementById('dScore').innerHTML=(score==null?'—':score)+'<small>/100</small>';
  document.getElementById('dScore').style.borderColor=tierOf(id).color;
  document.getElementById('dScore').style.borderWidth='2px';
  renderRaw(id);
  document.getElementById('qolNote').textContent = viewInds.length ? 'من 100 — '+(viewInds.length>1?'متوسط المؤشرات المختارة':'درجة المؤشر المختار') : hasData(id) ? 'من 100 — محسوب من مؤشرات الحي' : 'من 100 — رقم تجريبي حتى تُضاف المؤشرات';
  document.getElementById('sheet').classList.add('open');
  Object.entries(layers).forEach(([k,v])=>{ if(map.hasLayer(v.layer)) v.layer.setStyle(styleFor(k,k===id)); });
  layers[id].layer.bringToFront();
  pick.value=id;
  map.fitBounds(layers[id].layer.getBounds(),{padding:[40,40], maxZoom:15});
}
function openChart(){
  if(!selected) return;
  const p=layers[selected].props;
  document.getElementById('sheet').classList.add('expanded');
  document.getElementById('chartTitle').textContent='مؤشرات · '+p.label;
  if(chartObj){ chartObj.destroy(); chartObj=null; }
  const note=document.getElementById('chartNote');
  const c=QD.computed&&QD.computed[selected];
  if(!c || !QD.indicators.length){
    note.textContent='لا توجد بيانات مؤشرات لهذا الحي بعد.';
    return;
  }
  note.textContent='درجة كل مؤشر من 100 (الأعلى أفضل) مقارنةً بمتوسط الأحياء.';
  const labels=QD.indicators.map(i=>i.name);
  const own=QD.indicators.map(i=>c.scores[i.key]!=null?c.scores[i.key]:null);
  const raw=QD.indicators.map(i=>{ const x=(QD.values[selected]||{})[i.key]; return (x==null||x==='')?null:Number(x); });
  const avg=QD.indicators.map(i=>{
    const xs=Object.values(QD.computed).map(r=>r.scores[i.key]).filter(x=>x!=null);
    return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length*10)/10:null;
  });
  document.querySelector('.chart-wrap').style.height=Math.max(320,QD.indicators.length*58)+'px';
  chartObj=new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{labels, datasets:[
      {label:p.label, data:own, backgroundColor:tierOf(selected).color, borderRadius:4},
      {label:'متوسط الأحياء', data:avg, backgroundColor:'#c3cad2', borderRadius:4}
    ]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:true, position:'bottom'},
        tooltip:{callbacks:{
          label:t=>t.dataset.label+': '+fmtN(t.parsed.x)+' / 100',
          afterLabel:t=>{ if(t.datasetIndex!==0||raw[t.dataIndex]==null) return ''; const u=QD.indicators[t.dataIndex].unit; return 'القيمة: '+fmtN(raw[t.dataIndex])+(u?' '+u:''); }
        }}},
      scales:{x:{min:0,max:100,grid:{color:'#eee'}}, y:{grid:{display:false}}}}
  });
}
function applyQD(d){
  QD=Object.assign(normQD(d),{src:'file'});
  TIERS.forEach((t,i)=>{ if(i<2) t.min=QD.settings.thresholds[i]; });
  viewChanged();
}
function showAll(){
  selected=null;
  collapseChart();
  Object.entries(layers).forEach(([k,v])=>{
    const ok=!activeTier||tierKey(k)===activeTier;
    if(ok){ if(!map.hasLayer(v.layer)) v.layer.addTo(group); v.layer.setStyle(styleFor(k,false)); }
    else if(map.hasLayer(v.layer)) group.removeLayer(v.layer);
  });
  map.fitBounds(group.getBounds(),{padding:[28,28]});
  document.getElementById('sheet').classList.remove('open');
  }
function applyFilter(id){
  Object.entries(layers).forEach(([k,v])=>{
    const show=(!id||k===id)&&(!activeTier||tierKey(k)===activeTier);
    if(show){ if(!map.hasLayer(v.layer)) v.layer.addTo(group); }
    else if(map.hasLayer(v.layer)) group.removeLayer(v.layer);
  });
  if(id) select(id,false);
  else showAll();
}
pick.addEventListener('change', ()=>applyFilter(pick.value));
q.addEventListener('input', ()=>{
  refill(q.value.trim());
  if(pick.options.length===2){ pick.value=pick.options[1].value; pick.dispatchEvent(new Event('change')); }
});
document.getElementById('close').addEventListener('click', ()=>{
  pick.value=''; q.value=''; refill(''); showAll();
});
document.getElementById('openChart').addEventListener('click', openChart);
document.getElementById('hideChart').addEventListener('click', collapseChart);
Chart.defaults.font.family='"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif';
const chipsEl=document.getElementById('chips');
function renderChips(){
  chipsEl.innerHTML='';
  const total=Object.keys(layers).length;
  const mk=(key,label,color,count)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='chip'+(activeTier===key?' on':'');
    if(color) b.style.setProperty('--c',color);
    b.innerHTML=(color?'<i></i>':'')+label+'<span>'+count+'</span>';
    b.addEventListener('click',()=>setTier(activeTier===key?null:key));
    chipsEl.appendChild(b);
  };
  mk(null,'الكل','',total);
  TIERS.forEach(t=>mk(t.key,t.label,t.color,Object.keys(layers).filter(id=>tierKey(id)===t.key).length));
}
function setTier(key){
  activeTier=key;
  renderChips();
  refill(q.value.trim());
  applyFilter(pick.value);
}
function restyle(){
  Object.entries(layers).forEach(([k,v])=>{
    v.layer.setStyle(styleFor(k,k===selected));
    const s=viewScore(k);
    v.layer.eachLayer(l=>{ if(l.setTooltipContent) l.setTooltipContent(v.props.label+(viewInds.length?' — '+(s==null?'لا توجد بيانات':s+'/100'):'')); });
  });
}
function renderISel(){
  const el=document.getElementById('isel');
  viewInds=viewInds.filter(k=>QD.indicators.some(i=>i.key===k));
  if(!QD.indicators.length){ el.innerHTML=''; return; }
  el.innerHTML='<div class="it">عرض حسب مؤشر</div>';
  const mk=(label,on,fn)=>{ const b=document.createElement('button'); b.type='button'; b.className='ib'+(on?' on':''); b.textContent=label; b.addEventListener('click',fn); el.appendChild(b); };
  mk('الكل',!viewInds.length,()=>{ viewInds=[]; viewChanged(); });
  QD.indicators.forEach(i=>mk(i.name,viewInds.includes(i.key),()=>{ viewInds=viewInds.includes(i.key)?viewInds.filter(k=>k!==i.key):viewInds.concat(i.key); viewChanged(); }));
}
function viewChanged(){
  renderISel(); setTimeout(placeSheet,0); renderChips(); restyle(); refill(q.value.trim()); applyFilter(pick.value);
}
function placeSheet(){ const f=document.querySelector('.filter'); if(f) document.documentElement.style.setProperty('--st',(f.getBoundingClientRect().bottom+12)+'px'); }
window.addEventListener('resize',placeSheet); setTimeout(placeSheet,0);
renderISel();
renderChips();
if(QD.src==='none'){
  fetch('qol-data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&Array.isArray(d.indicators)) applyQD(d); }).catch(()=>{});
}
window.addEventListener('storage',e=>{
  if(e.key!=='hailQol.v2'||!e.newValue) return;
  try{ const d=JSON.parse(e.newValue); if(d&&Array.isArray(d.indicators)) applyQD(d); }catch(err){}
});
L.control.layers({'فاتحة': light, 'خريطة': streets, 'قمر صناعي': satellite}, null, {position:'topleft', collapsed:true}).addTo(map);
</script>
</body>
</html>
